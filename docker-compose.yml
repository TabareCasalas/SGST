version: '3.8'

services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: sgst_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sgst_db}
      POSTGRES_USER: ${POSTGRES_USER:-sgst_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sgst_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sgst_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sgst_user} -d ${POSTGRES_DB:-sgst_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sgst_backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-sgst_user}:${POSTGRES_PASSWORD:-sgst_password}@postgres:5432/${POSTGRES_DB:-sgst_db}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      REFRESH_SECRET: ${REFRESH_SECRET:-your-refresh-secret-change-this-in-production}
      ORCHESTRATOR_URL: http://orchestrator:3002
      ORCHESTRATOR_TOKEN: ${ORCHESTRATOR_TOKEN:-dev-orchestrator-token}
      PORT: 3001
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sgst_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3


  # Elasticsearch (requerido por Camunda 8 Operate)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: sgst_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
      - bootstrap.memory_lock=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    networks:
      - sgst_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Zeebe - Motor de procesos de Camunda 8
  zeebe:
    image: camunda/zeebe:8.5.0
    container_name: sgst_zeebe
    restart: unless-stopped
    environment:
      - ZEEBE_BROKER_DATA_DISKUSAGECOMMANDWATERMARK=0.998
      - ZEEBE_BROKER_DATA_DISKUSAGEREPLICATIONWATERMARK=0.999
      - ZEEBE_BROKER_CLUSTER_PARTITIONSCOUNT=2
      - ZEEBE_BROKER_CLUSTER_REPLICATIONFACTOR=1
      - ZEEBE_BROKER_CLUSTER_CLUSTERSIZE=1
      - ZEEBE_BROKER_CLUSTER_NODEID=0
      - ZEEBE_BROKER_NETWORK_HOST=0.0.0.0
      - ZEEBE_BROKER_NETWORK_ADVERTISEDHOST=zeebe
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_CLASSNAME=io.camunda.zeebe.exporter.ElasticsearchExporter
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_URL=http://elasticsearch:9200
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_BULK_SIZE=1
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_BULK_DELAY=5
    ports:
      - "${ZEEBE_PORT:-26500}:26500"
      - "${ZEEBE_GATEWAY_PORT:-26501}:26501"
    volumes:
      - zeebe_data:/usr/local/zeebe/data
      - ./camunda/diagrams:/usr/local/zeebe/configuration/resources
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - sgst_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9600/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Operate - Monitoreo y gestión de procesos
  operate:
    image: camunda/operate:8.5.0
    container_name: sgst_operate
    restart: unless-stopped
    environment:
      - CAMUNDA_OPERATE_ZEEBE_GATEWAYADDRESS=zeebe:26500
      - CAMUNDA_OPERATE_ELASTICSEARCH_URL=http://elasticsearch:9200
      - CAMUNDA_OPERATE_ZEEBEELASTICSEARCH_URL=http://elasticsearch:9200
      - CAMUNDA_OPERATE_MULTITENANCY_ENABLED=false
    ports:
      - "${OPERATE_PORT:-8081}:8080"
    depends_on:
      - zeebe
      - elasticsearch
    networks:
      - sgst_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Tasklist - Gestión de tareas de usuario
  tasklist:
    image: camunda/tasklist:8.5.0
    container_name: sgst_tasklist
    restart: unless-stopped
    environment:
      - CAMUNDA_TASKLIST_ZEEBE_GATEWAYADDRESS=zeebe:26500
      - CAMUNDA_TASKLIST_ELASTICSEARCH_URL=http://elasticsearch:9200
      - CAMUNDA_TASKLIST_ZEEBEELASTICSEARCH_URL=http://elasticsearch:9200
      - CAMUNDA_TASKLIST_GRAPHQL_URL=http://operate:8080
      - CAMUNDA_TASKLIST_MULTITENANCY_ENABLED=false
    ports:
      - "${TASKLIST_PORT:-8082}:8080"
    depends_on:
      - zeebe
      - operate
      - elasticsearch
    networks:
      - sgst_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Identity - Autenticación y autorización
  identity:
    image: camunda/identity:8.5.0
    container_name: sgst_identity
    restart: unless-stopped
    environment:
      - CAMUNDA_IDENTITY_DATABASE_URL=jdbc:postgresql://postgres:5432/camunda_db
      - CAMUNDA_IDENTITY_DATABASE_USERNAME=${POSTGRES_USER:-sgst_user}
      - CAMUNDA_IDENTITY_DATABASE_PASSWORD=${POSTGRES_PASSWORD:-sgst_password}
      - CAMUNDA_IDENTITY_DATABASE_DRIVER=org.postgresql.Driver
      - CAMUNDA_IDENTITY_AUTH_JWT_ISSUER=http://identity:8080
      - CAMUNDA_IDENTITY_AUTH_JWT_AUDIENCE=operate, tasklist, optimize
    ports:
      - "${IDENTITY_PORT:-8083}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sgst_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Orchestrator - Comunica Camunda 8 (Zeebe) con el Backend
  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: sgst_orchestrator
    restart: unless-stopped
    environment:
      ORCHESTRATOR_PORT: ${ORCHESTRATOR_PORT:-3002}
      ZEEBE_ADDRESS: zeebe:26500
      BACKEND_URL: http://backend:3001
      NODE_ENV: ${NODE_ENV:-production}
      ORCHESTRATOR_TOKEN: ${ORCHESTRATOR_TOKEN:-dev-orchestrator-token}
    ports:
      - "${ORCHESTRATOR_PORT:-3002}:3002"
    depends_on:
      - zeebe
      - backend
    networks:
      - sgst_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend React
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${BACKEND_URL:-http://localhost:3001}/api
    container_name: sgst_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - sgst_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PgAdmin (opcional, para administración de BD)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sgst_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@sgst.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-8080}:80"
    depends_on:
      - postgres
    networks:
      - sgst_network
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  zeebe_data:
    driver: local
  elasticsearch_data:
    driver: local

networks:
  sgst_network:
    driver: bridge


